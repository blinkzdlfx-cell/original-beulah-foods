<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/storefront/" />
  <title>Email verified — Beulah Foods</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__logo-wrap" href="index.html" aria-label="Beulah Foods home">
        <span class="site-header__mark" aria-hidden="true">B</span>
        <span class="site-header__brand">Beulah Foods</span>
      </a>
    </div>
  </header>

  <main class="auth-page">
    <section class="auth-card" aria-labelledby="verification-title">
      <div class="alert alert-success" role="status">
        Email verified successfully.
      </div>

      <h1 id="verification-title">Your account is verified</h1>
      <p class="auth-card__subtitle">
        Your email address has been confirmed. You can now continue shopping with Beulah Foods.
      </p>

      <a href="shop.html" class="btn btn-primary">Go to shop</a>
      <p class="auth-card__footer"><a href="index.html">Go to home</a></p>
    </section>
  </main>
</body>
</html>
