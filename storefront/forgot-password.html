<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot password — Beulah Foods</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/auth-refinement.css" />
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__logo-wrap" href="index.html" aria-label="Beulah Foods home">
        <span class="site-header__mark" aria-hidden="true">B</span>
        <span class="site-header__brand">Beulah Foods</span>
      </a>
      <nav id="site-header-nav" class="site-header__nav" aria-label="Main navigation" hidden></nav>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card card">
      <h1>Forgot password</h1>
      <p class="auth-card__subtitle">We'll email you a link to reset it.</p>

      <div id="form-alert" class="alert" role="alert" hidden></div>

      <form id="forgot-password-form" novalidate>
        <div class="form-field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
        </div>

        <button type="submit" class="btn btn-primary" id="forgot-password-submit">Send reset link</button>
      </form>

      <p class="auth-card__footer">Remembered your password? <a href="login.html">Log in</a></p>
    </div>
  </main>

  <script type="module" src="js/pages/forgot-password.js"></script>
<footer class="site-footer"><div class="footer__inner"><div><div class="footer__brand">Beulah Foods</div><p class="footer__copy">Eat Healthy, Live Healthy.</p><p class="footer__copy">Lagos, Nigeria</p></div><div class="footer__links"><div><strong>Navigate</strong><a href="shop.html">Shop</a><a href="how-to.html">How To</a><a href="account.html">My Account</a><a href="orders.html">My Orders</a></div><div><strong>Legal</strong><a href="privacy-policy.html">Privacy Policy</a><a href="terms-of-service.html">Terms of Service</a></div><div><strong>Contact</strong><a href="mailto:hello@beulahfoods.com">hello@beulahfoods.com</a></div></div><p class="footer__copy footer__copyright">© <span id="footer-year"></span> Beulah Foods</p></div></footer>
  <script>document.getElementById("footer-year")?.replaceChildren(String(new Date().getFullYear()));</script>
</body>
</html>
