<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/storefront/" />
  <title>Reset password — Beulah Foods</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/auth-refinement.css" />
  <link rel="stylesheet" href="css/password-toggle.css" />
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__logo-wrap" href="index.html" aria-label="Beulah Foods home">
        <span class="site-header__mark" aria-hidden="true">B</span>
        <span class="site-header__brand">Beulah Foods</span>
      </a>
      <nav id="site-header-nav" class="site-header__nav" aria-label="Main navigation" hidden></nav>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card card">
      <h1>Reset password</h1>
      <p class="auth-card__subtitle">Choose a new password for your account.</p>

      <div id="form-alert" class="alert" role="alert" hidden></div>

      <p id="reset-password-status" class="auth-card__subtitle">Verifying your reset link…</p>

      <form id="reset-password-form" novalidate hidden>
        <div class="form-field">
          <label for="new-password">New password</label>
          <input id="new-password" name="newPassword" type="password" autocomplete="new-password" data-password-toggle required />
        </div>

        <div class="form-field">
          <label for="confirm-new-password">Confirm new password</label>
          <input id="confirm-new-password" name="confirmNewPassword" type="password" autocomplete="new-password" data-password-toggle required />
        </div>

        <button type="submit" class="btn btn-primary" id="reset-password-submit">Set new password</button>
      </form>

      <p class="auth-card__footer"><a href="login.html">Back to log in</a></p>
    </div>
  </main>

  <script type="module" src="js/pages/reset-password.js"></script>
  <script type="module" src="js/components/passwordToggle.js"></script>
</body>
</html>
