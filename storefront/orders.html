<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Orders — Beulah Foods</title>
  <base href="/storefront/">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/account.css">
  <link rel="stylesheet" href="css/orders.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__logo-wrap" href="/" aria-label="Beulah Foods home">
        <span class="site-header__mark"></span>
        <span class="site-header__brand">Beulah Foods</span>
      </a>
      <nav id="site-header-nav" class="site-header__nav" aria-label="Main navigation" hidden></nav>
    </div>
  </header>

  <main class="account-page orders-page">
    <section class="page-heading">
      <p class="eyebrow">My account</p>
      <h1>My orders</h1>
      <p>View your orders, payment status, and reservations.</p>
    </section>

    <section class="card orders-card" aria-labelledby="reservations-heading">
      <div class="orders-section-heading">
        <div>
          <p class="orders-section-eyebrow">Checkout</p>
          <h2 id="reservations-heading">My reservations</h2>
          <p>Open reservations hold stock while you complete payment. You can have up to two open reservations at a time.</p>
        </div>
        <span id="open-reservation-count" class="orders-reservation-count">0 / 2 open</span>
      </div>
      <div id="reservations-status" class="alert" role="status" hidden></div>
      <div id="reservations-list" class="orders-list"></div>
    </section>

    <section class="card orders-card" aria-labelledby="orders-heading">
      <div class="orders-section-heading">
        <div>
          <p class="orders-section-eyebrow">History</p>
          <h2 id="orders-heading">Order history</h2>
        </div>
      </div>
      <div id="orders-status" class="alert" role="status" hidden></div>
      <div id="orders-list" class="orders-list"></div>
    </section>
  </main>

  <script type="module" src="js/pages/orders.js"></script>
</body>
</html>
