# Cloudflare deployment source: main
name = "original-beulah-foods"
main = "worker.js"
compatibility_date = "2026-09-16"

[vars]
SUPABASE_URL = "https://wzrqlquspbipvrzidcxe.supabase.co"
AI_PROVIDER_ORDER = "cloudflare,openrouter,huggingface"
AI_CLOUDFLARE_MODEL = "@cf/zai-org/glm-4.7-flash"
# Set these when the provider is enabled. The provider is skipped when its key or model is absent.
AI_OPENROUTER_MODEL = ""
AI_HUGGINGFACE_MODEL = ""

[secrets]
required = ["PAYSTACK_SECRET_KEY", "SUPABASE_SECRET_KEY"]

[assets]
directory = "."
binding = "ASSETS"
html_handling = "none"
not_found_handling = "404-page"
run_worker_first = true

[observability]
enabled = true

[ai]
binding = "AI"

# TEST-only D1 binding for Beulah AI conversation history.
[[d1_databases]]
binding = "AI_DB"
database_name = "original-beulah-ai"
database_id = "2ab4c58d-40e3-43e0-a1b1-019e1f0e473a"

[triggers]
crons = ["0 2 * * *"]


# TEST/production-safe AI request protection.
[[ratelimits]]
name = "AI_CHAT_RATE_LIMITER"
namespace_id = "2026091801"

  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "AI_MUTATION_RATE_LIMITER"
namespace_id = "2026091802"

  [ratelimits.simple]
  limit = 5
  period = 60
