<!doctype html>
<html lang="en-NG">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#18300f">
  <title>You're offline — Beulah Foods</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f9f5;color:#263026;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(460px,100%);padding:32px;border:1px solid #dce4dc;border-radius:20px;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.10);text-align:center}
    .mark{width:54px;height:54px;margin:0 auto 18px;display:grid;place-items:center;border-radius:15px;background:#18300f;color:#c9f36a;font-weight:900;font-size:1.25rem}
    h1{margin:0 0 8px;font-size:1.35rem}p{margin:0;color:#687366;line-height:1.6;font-size:.9rem}
    button{margin-top:22px;min-height:42px;padding:0 16px;border:0;border-radius:9px;background:#18300f;color:#fff;font:inherit;font-weight:750;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">B</div>
    <h1>You're offline</h1>
    <p>Beulah Foods is still available for cached pages, but live products, orders, payments and Beulah AI need an internet connection.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
