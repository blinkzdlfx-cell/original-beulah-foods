<!doctype html>
<html lang="en-NG">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Page not found — Beulah Foods</title>
  <style>
    :root{color-scheme:light}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7faf7;color:#172019;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(620px,100%);padding:40px;border:1px solid #dce5de;border-radius:20px;background:#fff;box-shadow:0 18px 50px rgba(16,24,20,.08);text-align:center}
    .mark{width:56px;height:56px;margin:0 auto 20px;border-radius:16px;background:#00a85a;display:grid;place-items:center;color:#fff;font-weight:900;font-size:24px}
    .code{margin:0;color:#00a85a;font-size:.8rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
    h1{margin:8px 0 12px;font-size:clamp(2rem,7vw,3.2rem);letter-spacing:-.04em}
    p{margin:0 auto;max-width:470px;color:#5d6961;line-height:1.6}
    .actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:26px}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:10px;text-decoration:none;font-weight:700}
    .primary{background:#00a85a;color:#fff}
    .secondary{border:1px solid #dce5de;color:#172019;background:#fff}
    @media(max-width:520px){main{padding:30px 22px}.actions{flex-direction:column}.actions a{width:100%}}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">B</div>
    <p class="code">404 · Page not found</p>
    <h1>We couldn't find that page.</h1>
    <p>The address may be incorrect, or the page may have moved. Use one of the links below to continue shopping with Beulah Foods.</p>
    <div class="actions">
      <a class="primary" href="/">Go to homepage</a>
      <a class="secondary" href="/shop">Browse products</a>
    </div>
  </main>
</body>
</html>
