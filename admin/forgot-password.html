<!doctype html>
<html lang="en-NG">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beulah Foods Admin — Forgot Password</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="stylesheet" href="css/admin-refinement.css" />
</head>
<body>
  <div class="auth-shell">
    <main class="auth-main">
      <section class="auth-card" aria-labelledby="page-title">
        <div class="auth-brand" aria-label="Beulah Foods administration">
          <span class="auth-brand__mark">BF</span>
          <span>Beulah Foods <strong>Admin</strong></span>
        </div>

        <div class="auth-heading">
          <div class="auth-icon" aria-hidden="true">↻</div>
          <div>
            <p class="auth-eyebrow">Account recovery</p>
            <h1 id="page-title">Forgot your password?</h1>
            <p class="auth-description">Enter the email address for your authorized admin account. We’ll send you a secure link to create a new password.</p>
          </div>
        </div>

        <div id="alert" class="alert auth-alert" role="status" aria-live="polite" hidden></div>

        <form id="forgot-password-form" class="auth-form">
          <div class="field">
            <label for="admin-email">Admin email address</label>
            <input id="admin-email" name="email" type="email" autocomplete="username" inputmode="email" placeholder="admin@example.com" required />
          </div>

          <button id="submit-button" class="btn btn-primary auth-submit" type="submit">
            <span>Send reset link</span>
          </button>
        </form>

        <div class="auth-help">
          <span class="auth-help__line"></span>
          <p>Only accounts authorized for the admin area can access admin tools.</p>
          <span class="auth-help__line"></span>
        </div>

        <a class="auth-back-link" href="/admin/">← Back to admin sign in</a>
      </section>
    </main>
  </div>

  <script type="module">
    import { supabase } from "./js/lib/supabaseClient.js";

    const form = document.getElementById("forgot-password-form");
    const emailInput = document.getElementById("admin-email");
    const submitButton = document.getElementById("submit-button");
    const alertBox = document.getElementById("alert");

    function showAlert(message, type = "success") {
      alertBox.textContent = message;
      alertBox.className = `alert auth-alert ${type}`;
      alertBox.hidden = false;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      alertBox.hidden = true;
      submitButton.disabled = true;
      submitButton.querySelector("span").textContent = "Sending…";

      try {
        const email = emailInput.value.trim();
        const redirectTo = new URL("reset-password.html", `${window.location.origin}/admin/`).href;

        const { error } = await supabase.auth.resetPasswordForEmail(email, {
          redirectTo,
        });

        if (error) throw error;

        showAlert("If this email belongs to an authorized admin account, a password reset link has been sent.");
        form.reset();
      } catch (error) {
        showAlert(error?.message || "Unable to send the password reset email.", "error");
      } finally {
        submitButton.disabled = false;
        submitButton.querySelector("span").textContent = "Send reset link";
      }
    });
  </script>
</body>
</html>
