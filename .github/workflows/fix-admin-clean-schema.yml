name: Fix admin clean-schema queries

on:
  push:
    paths:
      - '.github/workflows/fix-admin-clean-schema.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin delivery contract
        run: |
          sed -i 's/id,delivery_fee,free_delivery_threshold,is_delivery_enabled,is_free_delivery_enabled,is_active,updated_at/id,delivery_fee,is_delivery_enabled,is_active,updated_at/' admin/js/admin.js
          sed -i '/deliveryForm.addEventListener("submit", async (event) => {/a\  return;' admin/js/admin.js
      - name: Commit admin.js
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/js/admin.js
          git diff --cached --quiet && exit 0
          git commit -m 'Align admin delivery query with clean schema'
          git push
