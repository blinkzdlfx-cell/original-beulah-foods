name: Normalize imported storefront

on:
  push:
    branches:
      - feature/frontend-foundation

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize deployment-specific paths
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('storefront')
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.html', '.js', '.css'}:
                  continue
              text = path.read_text(encoding='utf-8')
              text = text.replace('https://beulah-foods.blinkzdlfx.workers.dev', '')
              text = text.replace('/storefront/assets/', '/assets/')
              text = text.replace('/storefront/', '/')
              text = text.replace('  <base href="/" />\n', '')
              text = text.replace('  <base href="/storefront/" />\n', '')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Remove this one-time workflow
        run: rm -f .github/workflows/normalize-storefront.yml

      - name: Commit normalized storefront
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storefront .github/workflows/normalize-storefront.yml
          if git diff --cached --quiet; then
            echo "No normalization changes required."
            exit 0
          fi
          git commit -m "refactor: normalize storefront paths"
          git push origin HEAD:feature/frontend-foundation
