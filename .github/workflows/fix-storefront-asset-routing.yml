name: Fix storefront asset routing

on:
  push:
    paths:
      - '.github/workflows/fix-storefront-asset-routing.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore storefront static asset routing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('worker.js')
          text = path.read_text()
          old = '''  if (\n    path.endsWith(".html") &&\n    !path.startsWith("/storefront/") &&\n    !path.startsWith("/admin/")\n  ) {\n    const storefrontUrl = new URL(request.url);\n    storefrontUrl.pathname = `/storefront${path}`;\n    return env.ASSETS.fetch(new Request(storefrontUrl, request));\n  }\n\n  return env.ASSETS.fetch(request);'''
          new = '''  if (\n    path.endsWith(".html") &&\n    !path.startsWith("/storefront/") &&\n    !path.startsWith("/admin/")\n  ) {\n    const storefrontUrl = new URL(request.url);\n    storefrontUrl.pathname = `/storefront${path}`;\n    return env.ASSETS.fetch(new Request(storefrontUrl, request));\n  }\n\n  // Storefront HTML is exposed at root-level URLs, but its static files\n  // remain under /storefront in the asset bundle. Map those root-relative\n  // CSS, JS, image, and other asset requests back to the storefront tree.\n  if (!path.startsWith("/admin/") && !path.startsWith("/storefront/")) {\n    const storefrontAssetUrl = new URL(request.url);\n    storefrontAssetUrl.pathname = `/storefront${path}`;\n    return env.ASSETS.fetch(new Request(storefrontAssetUrl, request));\n  }\n\n  return env.ASSETS.fetch(request);'''
          if old not in text:
              raise SystemExit('Expected asset routing block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit worker fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix storefront static asset routing'
          git push
