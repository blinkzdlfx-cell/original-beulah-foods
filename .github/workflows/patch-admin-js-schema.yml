name: Patch admin schema

on:
  push:
    paths:
      - '.github/workflows/patch-admin-js-schema.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin delivery query
        run: |
          sed -i 's/id,delivery_fee,free_delivery_threshold,is_delivery_enabled,is_free_delivery_enabled,is_active,updated_at/id,delivery_fee,is_delivery_enabled,is_active,updated_at/' admin/js/admin.js
          sed -i '/is_free_delivery_enabled: false,/,+1d' admin/js/admin.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/js/admin.js
          git diff --cached --quiet && exit 0
          git commit -m 'Align admin delivery query with clean schema'
          git push
